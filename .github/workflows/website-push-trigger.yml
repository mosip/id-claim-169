name: Deploy to S3 and invalidate CloudFront

on:
  push:
    branches:
      - MOSIP-45104
    paths:
      - 'id-claim-169-ui/**'
  workflow_dispatch:
    inputs:
      update_s3:
        description: 'Sync latest code to S3 (uncheck to only invalidate CloudFront cache)'
        required: false
        type: boolean
        default: false
      invalidate_only:
        description: 'Skip S3 sync and only invalidate CloudFront cache'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_DEPLOY_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync files to S3
        if: github.event_name != 'workflow_dispatch' || inputs.update_s3 == true
        run: |
          aws s3 sync id-claim-169-ui s3://${{ vars.S3_BUCKET_NAME }} \
            --delete \
            --exclude ".git/*" \
            --exclude "*.md"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
